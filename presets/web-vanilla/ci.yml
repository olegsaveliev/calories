name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dev tooling
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Test (regression suite)
        run: npm test
