project:
  name: "Calories"
  slug: "calories"
  one_liner: "Calculates the calories in a meal from a photo of the food."
  primary_user: "Anyone who wants to know the calories in a meal from a photo."
  non_goals: "No accounts/login, no meal history/tracking, no nutrition beyond a calorie estimate (yet)."
stack:
  preset: "node"
  notes: "Node serves the frontend and hosts the API route that calls the vision model (an API key can't live safely in client-only code). ESLint + Vitest."
github:
  enable: true
  remote: "https://github.com/olegsaveliev/calories.git"
  default_branch: "main"
  protect_branch: true
first_features:
  - id: "001"
    name: "Initial prototype"
    one_liner: "Upload a picture of food."
    size: "S"
