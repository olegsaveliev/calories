<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calories</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    .controls { display: flex; gap: .5rem; align-items: center; margin: 1rem 0; flex-wrap: wrap; }
    .notice { font-size: .875rem; color: #555; border-left: 3px solid #ccc; padding-left: .75rem; }
    #status { margin-top: 1rem; min-height: 1.5rem; }
    #status.ok { color: #0a7d28; }
    #status.err { color: #b00020; }
    button { padding: .4rem .8rem; }
  </style>
</head>
<body>
  <main id="app">
    <h1 data-testid="title">Calories</h1>
    <p>Pick a food photo and send it to the service.</p>

    <!-- R10(b) — plain-language notice: the photo leaves this machine. No dark patterns. -->
    <p class="notice" data-testid="privacy-notice">
      Your photo is sent to Anthropic's Claude model to estimate the calories. Location and camera
      metadata are removed before it is sent, and neither the photo nor the estimate is stored here.
    </p>

    <div class="controls">
      <!-- AC1.1 — visible file input that accepts images + a control to send it -->
      <input type="file" accept="image/*" data-testid="file-input" />
      <button type="button" data-testid="send-button">Send photo</button>
    </div>

    <!-- AC1.3 — visible confirmation area (rendered with textContent, never innerHTML) -->
    <div id="status" data-testid="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const fileInput = document.querySelector('[data-testid="file-input"]');
    const sendButton = document.querySelector('[data-testid="send-button"]');
    const status = document.querySelector('[data-testid="status"]');

    function setStatus(text, ok) {
      status.textContent = text;              // textContent only — no innerHTML
      status.className = ok ? 'ok' : 'err';
    }

    sendButton.addEventListener('click', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        setStatus('Please choose an image first.', false);
        return;
      }

      setStatus('Uploading…', true);
      try {
        // ADR-002 — send the File as the raw request body; MIME in Content-Type.
        const res = await fetch('/upload', {
          method: 'POST',
          body: file,
          headers: { 'Content-Type': file.type || 'application/octet-stream' },
        });
        let data = {};
        try { data = await res.json(); } catch { /* non-JSON body */ }

        if (res.ok && data.ok && data.calorieResult) {
          // 002: render the calorie-model outcome, never the plain 001 "file received" line.
          const cr = data.calorieResult;
          if (cr.status === 'estimated') {
            // AC1.1 — happy path: a single displayed calorie number.
            setStatus(`~${cr.calories} calories`, true);
          } else if (cr.status === 'no_food') {
            // AC3.1 — no recognizable meal in the photo: clear message, no number.
            setStatus("Couldn't identify a meal in this photo.", false);
          } else {
            // AC1.2 — refusal/timeout/network/parse failure: clear message, no number.
            setStatus("Couldn't estimate calories, try again.", false);
          }
        } else if (res.ok && data.ok) {
          // Fallback for a success response with no calorieResult (shouldn't happen in practice).
          setStatus(`Photo received: ${data.size} bytes, ${data.type}.`, true);
        } else if (res.status === 415) {
          // Story 2 / AC2.2 — unsupported/ambiguous image type, rejected before reaching the model.
          setStatus('Unsupported file type.', false);
        } else {
          setStatus(`Upload rejected: ${data.error || res.status}.`, false);
        }
      } catch {
        setStatus('Network error — could not reach the server.', false);
      }
    });
  </script>
</body>
</html>
